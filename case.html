<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZeroDrop — Кейс</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Unbounded:wght@600;700;800&display=swap&subset=cyrillic" rel="stylesheet">
<link rel="stylesheet" href="/css/theme.css">
<link rel="stylesheet" href="/css/case.css">
</head>
<body>
<div class="topbar">
  <a href="/" class="logo" aria-label="ZeroDrop"><img src="/images/logo_zerodrop.png" alt="ZeroDrop"></a>
  <div class="user-panel">
    <a class="balance" href="/profile.html"><div class="balance-title">Баланс</div><div class="balance-money" id="balance">0 ₽</div></a>
  </div>
</div>

<main class="case-page">
  <a class="back" href="/">← Назад к кейсам</a>

  <div class="case-hero">
    <img id="caseImage" src="" alt="">
    <h1 id="title">Кейс</h1>
    <div class="case-price" id="price">—</div>
  </div>

  <div class="qty-row" id="qtyRow">
    <button type="button" class="qty-btn active" data-qty="1">x1</button>
    <button type="button" class="qty-btn" data-qty="2">x2</button>
    <button type="button" class="qty-btn" data-qty="3">x3</button>
    <button type="button" class="qty-btn" data-qty="5">x5</button>
    <button type="button" class="qty-btn" data-qty="10">x10</button>
  </div>

  <div class="roulette-stack" id="rouletteStack">
    <div class="roulette-wrap"><div class="roll" data-roll="0"></div></div>
  </div>

  <div class="open-row">
    <button class="btn-open" id="open">ОТКРЫТЬ x1</button>
  </div>
  <div class="total-price" style="text-align:center">Итого: <b id="totalPrice">—</b></div>
  <div class="result-box" id="result"></div>
  <div class="multi-results" id="multiResults"></div>
  <div class="sell-bar" id="sellBar">
    <button type="button" class="btn-sell-all" id="sellAllBtn">Продать всё</button>
    <button type="button" class="btn-keep" id="keepBtn">Оставить</button>
  </div>

  <section class="contents">
    <h2>Содержимое кейса</h2>
    <div class="contents-grid" id="items"></div>
  </section>
</main>
<nav class="bottom-nav">
  <a class="nav-item" href="/" aria-current="page"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg><span>Кейсы</span></a>
  <a class="nav-item" href="/upgrade.html"><svg viewBox="0 0 24 24"><path d="M12 3l8 9h-5v9H9v-9H4z"/></svg><span>Апгрейд</span></a>
  <a class="nav-cta auth-profile-link" data-guest-label="Войти" href="/auth/steam">Войти</a>
  <a class="nav-item" href="/contracts.html"><svg viewBox="0 0 24 24"><path d="M4 4h10l6 6v10H4zM14 4v6h6" opacity=".95"/></svg><span>Контракты</span></a>
</nav>


<script src="/js/common.js"></script>
<script src="/js/case.js?v=2"></script>
</body>
</html>
