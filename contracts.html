<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZeroDrop — Контракты</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Unbounded:wght@600;700;800&display=swap&subset=cyrillic" rel="stylesheet">
<link rel="stylesheet" href="/css/theme.css">
<link rel="stylesheet" href="/css/contracts.css">
</head>
<body>
<div class="topbar">
  <a href="/" class="logo" aria-label="ZeroDrop"><img src="/images/logo_zerodrop.png" alt="ZeroDrop"></a>
  <div class="user-panel">
    <a class="balance" href="/profile.html"><div class="balance-title">Баланс</div><div class="balance-money" id="balance">0 ₽</div></a>
  </div>
</div>

<main class="contracts-page">
  <h1 class="contracts-title">КОНТРАКТЫ</h1>

  <div class="contract-slots" id="contractSlots"></div>

  <div class="contract-info">
    <div class="ci-item">
      <div class="ci-label">Ваш баланс</div>
      <div class="ci-value" id="ciBalance">0 ₽</div>
    </div>
    <div class="ci-item">
      <div class="ci-label">Сумма контракта</div>
      <div class="ci-value" id="ciSum">0 ₽</div>
    </div>
    <div class="ci-hint" id="ciHint">Положите минимум 3 предмета</div>
  </div>

  <div class="contract-msg" id="contractMsg"></div>
  <button type="button" class="btn-sign" id="signBtn" disabled>ПОДПИСАТЬ</button>

  <div class="contract-result" id="contractResult">
    <img id="resultImg" alt="">
    <div class="rn" id="resultName"></div>
    <div class="rp" id="resultPrice"></div>
    <div class="rt">Контракт выполнен</div>
  </div>

  <div class="contract-bottom">
    <div class="section-box">
      <div class="section-head">
        <h2>Мои предметы</h2>
        <span class="cnt" id="invCount">0 шт.</span>
      </div>
      <div class="inv-grid" id="myItems"></div>
    </div>
  </div>
</main>
<nav class="bottom-nav">
  <a class="nav-item" href="/"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg><span>Кейсы</span></a>
  <a class="nav-item" href="/upgrade.html"><svg viewBox="0 0 24 24"><path d="M12 3l8 9h-5v9H9v-9H4z"/></svg><span>Апгрейд</span></a>
  <a class="nav-cta auth-profile-link" data-guest-label="Войти" href="/auth/steam">Войти</a>
  <a class="nav-item" href="/contracts.html" aria-current="page"><svg viewBox="0 0 24 24"><path d="M4 4h10l6 6v10H4zM14 4v6h6" opacity=".95"/></svg><span>Контракты</span></a>
</nav>


<script src="/js/common.js"></script>
<script src="/js/contracts.js?v=1"></script>
</body>
</html>
